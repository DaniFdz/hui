<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/pi-logo-3d.png" />
    <title>HUI</title>
    <script>
      // The boot screen (src/lib/boot-screen.ts) paints in the colours HUI last
      // showed on this device, or in HUI's own palette for the light or dark
      // mode the saved preference (or the system) asks for.
      (function () {
        var root = document.documentElement, look = null;
        try { look = JSON.parse(localStorage.getItem("hui.boot-look") || "null"); } catch (error) {}
        var preference = look && (look.preference === "light" || look.preference === "dark") ? look.preference : "";
        var mode = preference || (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        root.setAttribute("data-theme-mode", mode);
        root.style.colorScheme = mode;
        var colors = look && look[mode];
        if (!colors) return;
        ["bg", "text", "muted", "accent"].forEach(function (key) {
          var value = colors[key];
          if (typeof value === "string" && value.length < 200 && (!window.CSS || CSS.supports("color", value))) root.style.setProperty("--hui-boot-" + key, value);
        });
      })();
    </script>
    <style>
      /* The page's only content until the app has painted. Inline, so it needs
         nothing else to arrive. Defaults are HUI's claw palette. */
      #hui-boot { --boot-bg: #0e1015; --boot-text: #f4f4f5; --boot-muted: #8b8b94; --boot-accent: #ff5c5c;
        position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; padding: 24px;
        background: var(--hui-boot-bg, var(--boot-bg)); color: var(--hui-boot-muted, var(--boot-muted));
        font: 13px/1.45 var(--font-body, system-ui, sans-serif); }
      :root[data-theme-mode="light"] #hui-boot { --boot-bg: #faf9f7; --boot-text: #211e1a; --boot-muted: #6e6960; --boot-accent: #bd4531; }
      .hui-boot__card { display: grid; justify-items: center; gap: 12px; width: min(220px, 100%); text-align: center; }
      .hui-boot__logo { width: 56px; height: 56px; margin-bottom: 2px; }
      .hui-boot__name { color: var(--hui-boot-text, var(--boot-text)); font-size: 20px; font-weight: 650; letter-spacing: .04em; }
      .hui-boot__bar { position: relative; width: 100%; height: 3px; margin-top: 6px; overflow: hidden; border-radius: 3px;
        background: color-mix(in srgb, var(--hui-boot-text, var(--boot-text)) 12%, transparent); }
      .hui-boot__bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit;
        background: var(--hui-boot-accent, var(--boot-accent)); animation: hui-boot-slide 1.1s ease-in-out infinite; }
      .hui-boot__slow { margin: 0; opacity: 0; animation: hui-boot-reveal .3s ease 6s forwards; }
      .hui-boot__slow a, .hui-boot__failure button { color: var(--hui-boot-accent, var(--boot-accent)); font: inherit; }
      .hui-boot__failure { display: none; margin: 0; }
      .hui-boot__failure button { padding: 0; border: 0; background: none; cursor: pointer; text-decoration: underline; }
      #hui-boot[data-state="failed"] .hui-boot__bar, #hui-boot[data-state="failed"] .hui-boot__slow { display: none; }
      #hui-boot[data-state="failed"] .hui-boot__failure { display: block; }
      @keyframes hui-boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes hui-boot-reveal { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .hui-boot__bar::after { width: 100%; opacity: .45; animation: none; } }
    </style>
  </head>
