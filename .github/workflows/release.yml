name: Release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  plan:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      # Match the npm major used to generate the committed lockfile.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - name: Test release planning
        run: npx vitest run cli/release-workflow.test.mjs
      - name: Detect version bump and generate changelog
        id: release
        run: node scripts/release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.changed == 'true'
        with:
          name: release-changelog
          path: release-changelog.md
          if-no-files-found: error
  package:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      # Match the npm major used to generate the committed lockfile.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npx e2e-web install chromium --with-deps
      - run: npm run e2e
      - run: npm run test:package
      - name: Pack and checksum
        run: |
          npm pack --ignore-scripts
          sha256sum hui-*.tgz > "$(node -p "'hui-' + require('./package.json').version + '.tgz.sha256'")"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-changelog
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.plan.outputs.tag }}-package
          path: |
            hui-*.tgz
            hui-*.tgz.sha256
            release-changelog.md
          if-no-files-found: error
    e2e-ios:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      # Match the npm major used to generate the committed lockfile.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/e2e-ios
  nix:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    uses: ./.github/workflows/nix.yml
  publish:
    needs: [plan, package, e2e-ios, nix]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.tag }}-package
      - name: Publish release and tag the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" hui-*.tgz hui-*.tgz.sha256 release-changelog.md \
            --target "$RELEASE_SHA" --title "$RELEASE_TAG" --notes-file release-changelog.md
