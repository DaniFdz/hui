name: Release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  plan:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      # Match the npm major used to generate the committed lockfile.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - name: Test release planning
        run: npx vitest run cli/release-workflow.test.mjs
      - name: Detect version bump and generate changelog
        id: release
        run: node scripts/release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.changed == 'true'
        with:
          name: release-changelog
          path: release-changelog.md
          if-no-files-found: error
  package:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      # Match the npm major used to generate the committed lockfile.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npx e2e-web install chromium --with-deps
      - run: npm run e2e
      - run: npm run test:package
      - name: Pack and checksum
        run: |
          npm pack --ignore-scripts
          sha256sum hui-*.tgz > "$(node -p "'hui-' + require('./package.json').version + '.tgz.sha256'")"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-changelog
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.plan.outputs.tag }}-package
          path: |
            hui-*.tgz
            hui-*.tgz.sha256
            release-changelog.md
          if-no-files-found: error
  nix:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    uses: ./.github/workflows/nix.yml
  # The phone app's release APK, built from the commit `package` just validated. A release build is signed with the
  # owner's keystore and never falls back to the debug key or to no signature (mobile/AGENTS.md, owner decision
  # O4), so the keystore secrets are required here and their absence fails the job with a message that names them.
  android:
    needs: [plan, package]
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # The SDK download, the Gradle distribution and the release build; a hang fails here, not at GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      # Match the npm major used to generate the committed lockfile.
      - run: npm install -g npm@11
      # Capacitor 8 compiles at Java release 21, and the shell's own sources do too.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - run: npm ci --ignore-scripts
      # Builds the Connect page and runs `cap sync android`, which writes the plugin list the Gradle project reads.
      - run: npm run mobile:build
      - name: Read the version this release publishes
        id: version
        run: |
          set -euo pipefail
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          # Android's versionCode is a signed 32-bit int and a timestamp does not fit it, so it is the commit time in
          # minutes: it grows with every commit the release is built from and stays well inside the limit.
          echo "code=$(( $(git log -1 --format=%ct) / 60 ))" >> "$GITHUB_OUTPUT"
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HUI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::HUI_ANDROID_KEYSTORE_BASE64 is not set, and a release APK is signed with the owner's release keystore (owner decision O4, `mobile/AGENTS.md`). See mobile/AGENTS.md, Distribution, for the four secrets and how to make them."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hui-release.keystore"
          test -s "$RUNNER_TEMP/hui-release.keystore"
      - name: Build and sign the release APK
        working-directory: mobile/android
        env:
          # The three passwords never reach a command line: Gradle reads them as project properties from the
          # environment, so they cannot be echoed by a build log either.
          ORG_GRADLE_PROJECT_huiReleaseStorePassword: ${{ secrets.HUI_ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_huiReleaseKeyAlias: ${{ secrets.HUI_ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_huiReleaseKeyPassword: ${{ secrets.HUI_ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:assembleRelease \
            -PhuiVersionName="$VERSION" -PhuiVersionCode="$CODE" \
            -PhuiReleaseStoreFile="$RUNNER_TEMP/hui-release.keystore"
      - name: Name, verify and checksum the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="hui-$VERSION.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          # apksigner fails on an unsigned APK, and the badging proves the version and versionCode the release was given
          # are the ones inside it (the iOS job checks its Info.plist the same way).
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          head -1 "$RUNNER_TEMP/badging.txt"
          grep -F "versionCode='$CODE'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: |
            hui-*.apk
            hui-*.apk.sha256
          if-no-files-found: error
  # The unsigned IPA for the same commit, and the SideStore source that points at it. Nothing on Linux can archive for a
  # device, so this runs on the macOS runner; CODE_SIGNING_ALLOWED=NO leaves the signature to SideStore, which signs the
  # IPA with the user's own Apple ID (owner decision O1).
  ios:
    needs: [plan, package]
    if: needs.plan.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      # Match the npm major used to generate the committed lockfile.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: npm run mobile:build
      - run: npx cap sync ios
      - name: Read the version this release publishes
        id: version
        run: |
          set -euo pipefail
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          # CFBundleVersion and Android's versionCode carry the same number: the commit time in minutes.
          echo "code=$(( $(git log -1 --format=%ct) / 60 ))" >> "$GITHUB_OUTPUT"
      # The changelog the release publishes is also what SideStore shows for this version.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-changelog
      - name: Archive the app for a device, unsigned
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/hui.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$CODE" \
            archive | tee "$RUNNER_TEMP/xcodebuild-archive.log" | tail -20
      - name: Package the unsigned IPA and check its version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/hui.xcarchive/Products/Applications/App.app"
          test -d "$app"
          short=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Info.plist")
          echo "archive: $short ($build); the build was given $VERSION ($CODE)"
          # SideStore repeats both in its source and refuses an IPA whose Info.plist disagrees, so a placeholder that
          # never got overridden fails here instead of on a user's phone.
          [ "$short" = "$VERSION" ]
          [ "$build" = "$CODE" ]
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$app" "$RUNNER_TEMP/Payload/App.app"
          (cd "$RUNNER_TEMP" && zip -qry "hui-$VERSION.ipa" Payload)
          mv "$RUNNER_TEMP/hui-$VERSION.ipa" .
          unzip -l "hui-$VERSION.ipa" > "$RUNNER_TEMP/ipa-listing.txt"
          head -5 "$RUNNER_TEMP/ipa-listing.txt"
          # macOS has no sha256sum; shasum writes the same "<hash>  <file>" line it would.
          shasum -a 256 "hui-$VERSION.ipa" > "hui-$VERSION.ipa.sha256"
      - name: Write the SideStore source
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/sidestore-source.mjs \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --version "$VERSION" --build "$CODE" \
            --ipa "hui-$VERSION.ipa" --notes release-changelog.md \
            --out hui-sidestore.json
          shasum -a 256 hui-sidestore.json > hui-sidestore.json.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ipa
          path: |
            hui-*.ipa
            hui-*.ipa.sha256
            hui-sidestore.json
            hui-sidestore.json.sha256
          if-no-files-found: error
  publish:
    needs: [plan, package, nix, android, ios]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.tag }}-package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ipa
      - name: Publish release and tag the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" hui-*.tgz hui-*.tgz.sha256 release-changelog.md \
            hui-*.apk hui-*.apk.sha256 hui-*.ipa hui-*.ipa.sha256 hui-sidestore.json hui-sidestore.json.sha256 \
            --target "$RELEASE_SHA" --title "$RELEASE_TAG" --notes-file release-changelog.md
