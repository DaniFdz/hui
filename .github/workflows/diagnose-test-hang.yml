name: Diagnose test hang
# TEMPORARY, reverted before merge: finds what holds npm test open on GitHub's
# runners (two Nightly runs sat in it for over an hour). Several copies run at
# once because the hang is intermittent. Logs show selected fields of each
# process's state and an allowlist of environment variables only; nothing is
# uploaded, since the repository is public.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: diagnose-test-hang-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite:
    name: diagnose (suite ${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Install gdb for native stacks
        run: timeout 300 sudo apt-get install -y -qq --no-install-recommends gdb > /dev/null || echo "gdb is unavailable"
      # Attempts 4 to 6 also record where each open handle was created.
      - name: npm test, with a watchdog at four minutes
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          export NODE_OPTIONS="--report-on-signal --report-exclude-env --report-exclude-network --report-directory=$RUNNER_TEMP/reports"
          if [ "${{ matrix.attempt }}" -gt 3 ]; then
            export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.github/diagnostics/handles.mjs $NODE_OPTIONS"
          fi
          node .github/diagnostics/watchdog.mjs 240 -- npm test
  alone:
    name: diagnose (live-sessions alone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - name: Install gdb for native stacks
        run: timeout 300 sudo apt-get install -y -qq --no-install-recommends gdb > /dev/null || echo "gdb is unavailable"
      - name: server/live-sessions.test.ts alone, 60 times
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.github/diagnostics/handles.mjs --report-on-signal --report-exclude-env --report-exclude-network --report-directory=$RUNNER_TEMP/reports"
          failed=0
          for run in $(seq 1 60); do
            started=$(date +%s%N)
            if node .github/diagnostics/watchdog.mjs 45 -- node --test --test-timeout=60000 server/live-sessions.test.ts > "$RUNNER_TEMP/run.log" 2>&1; then
              echo "run $run passed in $(( ($(date +%s%N) - started) / 1000000 )) ms"
            else
              failed=$((failed + 1))
              echo "::group::run $run failed after $(( ($(date +%s%N) - started) / 1000000 )) ms"
              cat "$RUNNER_TEMP/run.log"
              echo "::endgroup::"
            fi
          done
          echo "$failed of 60 runs failed"
          test "$failed" = 0
