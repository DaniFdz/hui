name: E2E
# The shared e2e suite: e2e/tests/ against a disposable gateway, on the web in headless Chromium. A `mobile/**` package
# branch push runs it too, without a pull request of its own.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
  push:
    branches: [main, "mobile/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch or pull request supersedes a run in progress; a manual run supersedes nothing.
  group: e2e-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # A shard runs its tests serially (`workers: 1` in e2e.config.ts), so the
      # count sets the feedback wait: eight contiguous slices of about fifty
      # tests keep the slowest shard near ten minutes instead of fifteen.
      matrix:
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      # Match the npm major used to generate the committed lockfile.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      # The headless shell `e2e-web install` downloads is pinned by
      # playwright-core, so the lockfile hash names the build; a hit skips that
      # download and leaves only the system libraries to `--with-deps`.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx e2e-web install chromium --with-deps
      - run: npm run e2e -- --shard ${{ matrix.shard }}
      # Retain partial traces/screenshots and fixture logs even when a shard reaches its deadline or is cancelled.
      # A timeout can otherwise erase the earlier failure that kept the shard running.
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-${{ strategy.job-index }}
          path: |
            .e2e/
            /tmp/hui-visual-*/artifacts/
          include-hidden-files: true
          if-no-files-found: warn
