name: E2E
# The shared e2e suite on the web: e2e/tests/ against a disposable gateway, in headless Chromium.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # A newer push to the same branch or pull request supersedes a run in progress.
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      # Match the npm major used to generate the committed lockfile.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: npx e2e-web install chromium --with-deps
      - run: npm run e2e
      # The suite's traces and screenshots, and the launcher's gateway and provider logs.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-web
          path: |
            .e2e/
            /tmp/hui-visual-*/artifacts/
          include-hidden-files: true
          if-no-files-found: warn
