name: E2E catalogue
# Compares the use-case catalogue with the pull request's base: the baseline grows only for use cases the base
# already documented, and a use case the pull request changes leaves the web backlog.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: e2e-catalogue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      # Match the npm major used to generate the committed lockfile.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: node scripts/e2e-baseline-check.ts ${{ github.event.pull_request.base.sha }}
