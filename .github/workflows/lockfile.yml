name: Lockfile
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      # npm 10 (bundled with Node 22) misreads the lockfile's nested
      # electron/@types/node entry that npm 11 writes; use the same npm as
      # development so `npm ci` checks the lockfile we actually commit.
      - run: npm install -g npm@11
      # Fails when package.json and package-lock.json are out of sync.
      - run: npm ci --ignore-scripts
      - run: npm install -g @datadog/datadog-ci
      - name: Verify isolated visual-test runner
        run: node scripts/test.mjs e2e/visual-verification.test.mjs
        env:
          HUI_TEST_JUNIT_REPORT: test-results/visual-verification.xml
      - name: Upload test results to Datadog
        if: ${{ !cancelled() && hashFiles('test-results/*.xml') != '' }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "Datadog upload skipped: DD_API_KEY is unavailable in this run."
            exit 0
          fi
          datadog-ci junit upload --service hui test-results
        env:
          DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_ENV: ci
