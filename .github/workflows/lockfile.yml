name: Lockfile
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      # npm 10 (bundled with Node 22) misreads the lockfile's nested
      # electron/@types/node entry that npm 11 writes; use the same npm as
      # development so `npm ci` checks the lockfile we actually commit.
      - run: npm install -g npm@11
      # Fails when package.json and package-lock.json are out of sync.
      - run: npm ci --ignore-scripts
      - name: Verify isolated visual-test runner
        run: node --test e2e/visual-verification.test.mjs
