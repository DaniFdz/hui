<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HUI</title>
  </head>
  <body>
    <main>
      <h1>Connect to HUI</h1>
      <p>The address of the gateway you want this app to show.</p>
      <!-- novalidate: the page answers a bare host with its own message, not the browser's "Please enter a URL." -->
      <form id="connect-form" novalidate>
        <label for="gateway">Gateway URL</label>
        <input
          id="gateway"
          name="gateway"
          type="url"
          inputmode="url"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="https://my-machine.example.ts.net"
        />
        <button id="connect" type="submit">Connect</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="change-gateway" type="button" hidden>Change gateway</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
