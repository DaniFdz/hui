<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HUI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Connect to HUI</h1>
      <p>The address of the gateway you want this app to show.</p>
      <label for="gateway">Gateway URL</label>
      <input id="gateway" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://my-machine.example.ts.net" />
      <button id="connect" type="button">Connect</button>
      <p id="status" role="status"></p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
